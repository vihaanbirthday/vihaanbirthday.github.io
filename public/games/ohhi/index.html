  <body bgcolor="#222222" class="cartoon-game game-ohhi">
    <div id="container">
        <div id="title" class="screen show01 hide0 hide1 hidehs" data-action="close-titleScreen">
            <div class="vertical">
                <h1>Oh hi</h1>
                <div id="titlegrid" class="board">
                    <div id="digits">                    
                        <span id="zero">0</span><span id="hs"> h h </span><span id="one">1</span>
                    </div>
<table data-grid="titlegrid" cellpadding="0" cellspacing="0"><tbody><tr><td class="odd"><div class="tile tile-2"><div class="inner"></div></div></td><td class="even"><div class="tile tile-1"><div class="inner"></div></td></tr></tbody></table>

                </div>
                <p>
                    a little logic game<br>by Q42
                </p>
            </div>
        </div>

        <div id="menu" class="screen">
            <div class="vertical">
            <h2>Oh hi</h2>
                <button type="button" data-action="tutorial">How to play</button>
                <button type="button" data-action="play">Play</button>
                <button type="button" data-action="about">About</button>
            </div>
        </div>

        <div id="about" class="screen text">
            <div class="vertical">
            <h3>About</h3>
            <p>
            0h h1 is a little logic game<br>
            by Q42.<br>
            <br>
            It was created by<br>
            Martin Kool.<br>
            <br>
            The concept is also known<br>
            as Takuzu or Binairo.<br>
            <br>
            (c) 2014<br>
            www.q42.com
            </p><button type="button" data-action="show-menu">Back to menu</button>
            </div>
        </div>

        <div id="loading" class="screen">
            <div class="vertical">
                <h2>Loading</h2>
                <p></p>
                <div id="loadinggrid" class="board">
<table data-grid="loadinggrid" cellpadding="0" cellspacing="0"><tbody><tr><td class="odd"><div class="tile tile-2 loading"><div class="inner"></div></div></td></tr></tbody></table>
</div>
            </div>
        </div>

        <div id="game" class="screen">
            <p id="hintMsg" class="topMsg"></p>
            <p id="chooseSize" class="topMsg">Select a size to play...</p>
            <h2 id="boardsize"></h2>
            <div id="board" class="vertical board"></div>


            <div id="menugrid" class="vertical board hidden">
<table data-grid="menugrid" cellpadding="0" cellspacing="0"><tbody>
<tr><td class="odd"><div class="tile tile-2"><button type="button" data-action="startGame" data-size="1" class="inner" aria-label="Play 4 by 4 puzzle"></button></div></td><td class="even"><div class="tile tile-1"><button type="button" data-action="startGame" data-size="2" class="inner" aria-label="Play 6 by 6 puzzle"></button></div></td></tr>
<tr><td class="even"><div class="tile tile-1"><button type="button" data-action="startGame" data-size="3" class="inner" aria-label="Play 8 by 8 puzzle"></button></div></td><td class="odd"><div class="tile tile-2"><button type="button" data-action="startGame" data-size="4" class="inner" aria-label="Play 10 by 10 puzzle"></button></div></td></tr>
</tbody></table>
            </div>

            <div id="score">
                <img id="trophy" src="img/trophy.png"><span id="scorenr">30744</span>
            </div>
            <div id="bar">
                <button class="iconcon" type="button" data-action="undo" aria-label="Undo last move"><span id="undo" class="icon"></span></button>
                <button class="iconcon" type="button" data-action="back" aria-label="Back to puzzles"><span id="back" class="icon"></span></button>
                <a class="iconcon" id="tweeturl" target="_blank" href="about:blank" data-action="tweet"><span id="tweet" class="icon"></span></a>
                <button class="iconcon" type="button" data-action="help" aria-label="Get a hint"><span id="help" class="icon"></span></button>
            </div>
        </div>

    <div id="feelsize"></div>
